name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile # also runs `prisma generate` (postinstall)
      - run: pnpm exec prisma validate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Database (migrations, drift, sample load, health)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6 # same versions as Neon production
        env:
          POSTGRES_USER: agni
          POSTGRES_PASSWORD: agni
          POSTGRES_DB: agni
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agni -d agni"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://agni:agni@localhost:5432/agni
      DIRECT_URL: postgresql://agni:agni@localhost:5432/agni
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:deploy
      - name: Schema drift check (database must match schema.prisma exactly)
        run: pnpm db:drift
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Load the committed sample with the real pipeline
        run: uv run --project pipeline python -m agni all --raw data/sample --kind sample --dataset-version sample
      - name: Pipeline database tests (load is idempotent, geometry correct)
        working-directory: pipeline
        run: uv run pytest -q -m db
        env:
          AGNI_TEST_DATABASE_URL: postgresql://agni:agni@localhost:5432/agni
      - run: pnpm build
      - name: Health endpoint reports PostGIS and the loaded model
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health -o health.json && break; sleep 1; done
          cat health.json
          python3 -c "import json; r=json.load(open('health.json')); assert r['status']=='ok' and r['db']['postgis'] and r['data']['activeModel']=='raw-v0', r"

  pipeline:
    name: Pipeline (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # Added in later milestones:
  #   e2e (M9): Playwright smoke tests

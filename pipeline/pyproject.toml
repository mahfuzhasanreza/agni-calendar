[project]
name = "agni"
version = "0.1.0"
description = "Agni pipeline: clean, grid, aggregate and harmonize NASA FIRMS MODIS + VIIRS hotspots."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agni"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD002", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # allow non-ASCII (°, ×, Bangla) in strings/comments

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostGIS database in AGNI_TEST_DATABASE_URL"]
